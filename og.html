<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Булекбаевы — превью ссылки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Страница читается как разрез скважины: сверху поверхность, в глубине нефть.
   Фон — живая изометрическая сцена (кит Anatomy), текст — колонка поверх неё. */
:root{
  --bg:#f3f1ec;--fg:#1c1a17;--muted:#6b645a;--line:#d6d0c4;--oil:#2a2420;--ochre:#b7752b;--salt:#e4e6e8;--card:#fbfaf7;
  --panel:rgba(243,241,236,.9);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --col:min(640px, calc(46vw - 40px));
  /* материалы сцены */
  --m-edge:#2a241d;--f-salt:#e9e6df;--f-salt-x:#d9d5cc;--f-bed:rgba(60,48,36,.28);--f-oil:#2b211a;--f-bore:#1a1612;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14120f;--fg:#ece6db;--muted:#a39a8c;--line:#3a342c;--oil:#0b0a08;--ochre:#d9954a;--salt:#2a2d30;--card:#1c1915;
  --panel:rgba(20,18,15,.88);
  --m-edge:#0c0a08;--f-salt:#cfcbc2;--f-salt-x:#b8b3a8;--f-bed:rgba(20,16,12,.35);--f-oil:#1b1511;--f-bore:#0d0b09;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120f;--fg:#ece6db;--muted:#a39a8c;--line:#3a342c;--oil:#0b0a08;--ochre:#d9954a;--salt:#2a2d30;--card:#1c1915;
  --panel:rgba(20,18,15,.88);
  --m-edge:#0c0a08;--f-salt:#cfcbc2;--f-salt-x:#b8b3a8;--f-bed:rgba(20,16,12,.35);--f-oil:#1b1511;--f-bore:#0d0b09;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.65;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.08;margin:0}
a{color:var(--ochre)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Сцена на фоне ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
#scene .iso-halo{fill:#000;opacity:.28;filter:blur(14px);transform:translateY(8px)}
#scene path{vector-effect:non-scaling-stroke}
.iso-fill{stroke:none}
.iso-shade,.iso-top{stroke:none}
.iso-line{fill:none;stroke:var(--m-edge);stroke-width:.6px;stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="faint"]{stroke-opacity:.35}
.iso-line[data-tone="lo"]{stroke-opacity:.55}
.iso-line[data-tone="hi"]{stroke:#f3e6cf;stroke-opacity:.9}
.iso-line[data-dotted]{stroke-dasharray:.01 4;stroke-width:1.4px;stroke:#7a5a33;stroke-opacity:.55}
.iso-edge{stroke-opacity:.9}
.iso-solid{--c:#888}
.iso-solid>.iso-fill{fill:color-mix(in oklab,var(--c) 72%,#000)}
.iso-solid>.iso-shade[data-shade="0"]{fill:color-mix(in oklab,var(--c) 52%,#000)}
.iso-solid>.iso-shade[data-shade="1"]{fill:color-mix(in oklab,var(--c) 66%,#000)}
.iso-solid>.iso-shade[data-shade="2"]{fill:color-mix(in oklab,var(--c) 80%,#000)}
.iso-solid>.iso-shade[data-shade="3"]{fill:color-mix(in oklab,var(--c) 92%,#000)}
.iso-solid>.iso-top{fill:color-mix(in oklab,var(--c) 86%,#fff)}
.iso-solid>.iso-edge{stroke:color-mix(in oklab,var(--c) 30%,#000)}
.m-sand{--c:#d6b98a}.m-clay{--c:#a8835c}.m-carb{--c:#8d8070}.m-rock{--c:#5f554b}
.m-wood{--c:#9a6a3c}.m-roof{--c:#6f4a2a}.m-door{--c:#b4462e}.m-iron{--c:#4b4a48}.m-brick{--c:#9b4f37}
.m-felt{--c:#e7dcc6}.m-camel{--c:#c79a62}.m-camel-d{--c:#8f6a40}.m-cloth{--c:#6d5a7a}.m-skin{--c:#b0805a}
.m-steel{--c:#9aa1a6}.m-paint{--c:#c9543a}.m-yellow{--c:#e0b23c}.m-green{--c:#5b7a5a}.m-red{--c:#b9452f}
.m-pipe{--c:#6f7378}.m-cabin{--c:#d8d2c2}.m-bush{--c:#8e9a6e}
.brace.m-wood{stroke:#6b4524;stroke-opacity:.9;stroke-width:.7px}
.brace.m-paint{stroke:#8f3324;stroke-opacity:.85;stroke-width:.6px}
.cable{stroke:#2b2620;stroke-width:.9px;stroke-opacity:.9}
.cable.thin{stroke-width:.5px;stroke-opacity:.6}
.belt{stroke:#3a2a1c;stroke-width:1.2px}
.rope{stroke:#5b4630;stroke-width:.5px}
.f-salt{fill:var(--f-salt);stroke:color-mix(in oklab,var(--f-salt) 60%,#000);stroke-width:.6px}
.f-salt-x{fill:var(--f-salt-x)}
.f-bed{fill:none;stroke:var(--f-bed);stroke-width:.7px}
.f-flow{fill:none;stroke:rgba(120,130,140,.35);stroke-width:.6px;stroke-dasharray:6 5}
.f-oil{fill:var(--f-oil);stroke:#000;stroke-opacity:.5;stroke-width:.6px;transition:fill 1.2s ease}
.f-oil.on{fill:#d9954a;filter:drop-shadow(0 0 6px rgba(217,149,74,.7))}
.f-bore{fill:var(--f-bore);stroke:none}
.f-casing{fill:none;stroke:#9aa1a6;stroke-width:.8px}
.f-bit{fill:#d9954a;stroke:#2a1a0c;stroke-width:.6px}
.drop{fill:#17110c}
.jet{fill:#17110c}
.pool{fill:#17110c;stroke:none}
.puff{fill:#bdb6aa}
.flame{fill:#f0a040;opacity:.9;filter:drop-shadow(0 0 4px rgba(240,140,40,.8))}

/* HUD-карточка в стиле Anatomy */
.hud{position:fixed;right:20px;bottom:18px;z-index:2;width:min(420px,40vw);padding:12px 14px;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted);
  display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.hud b{font-weight:500;color:var(--fg)}
.hud [data-scene-readout]{color:var(--ochre);text-align:right;font-variant-numeric:tabular-nums}
.hud .hint{text-transform:uppercase;letter-spacing:.1em}
.hud .r{text-align:right}

/* ---------- Колонка с текстом ---------- */
main{position:relative;z-index:1}
.col{width:var(--col);margin-left:max(24px,3vw);padding-bottom:20px}
.panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);padding:40px 36px;margin:0 0 28px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-block:56px 40px}
.hero .panel{padding:44px 36px}
.hero h1{font-size:clamp(2.2rem,5.6vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{display:block;color:var(--ochre)}
.hero p.lead{font-size:1.18rem;max-width:34ch;margin:22px 0 0}
.hero .mono{margin-bottom:18px}
.scroll-cue{margin-top:28px;display:inline-flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.scroll-cue i{display:block;width:1px;height:28px;background:var(--ochre);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.3);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

.lineage{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;font-family:var(--mono);font-size:.82rem}
.lineage .n{padding:6px 12px;border:1px solid var(--line);border-radius:2px;background:var(--card)}
.lineage .n.h{border-style:dashed;color:var(--muted)}
.lineage .n.k{border-color:var(--ochre)}
.lineage .arr{color:var(--ochre)}

.part-head{display:flex;gap:18px;align-items:baseline;margin-bottom:16px}
.yr{font-family:var(--display);font-weight:600;font-size:2.2rem;line-height:1;color:var(--ochre)}
.panel h2{font-size:clamp(1.6rem,3.2vw,2.5rem);font-weight:800}
.sub{font-style:italic;color:var(--muted);margin:10px 0 26px;font-size:1.08rem}
.prose p{margin:0 0 1.1em}
.drop-cap::first-letter{font-family:var(--display);font-weight:800;float:left;font-size:3.4em;line-height:.82;padding:6px 10px 0 0;color:var(--ochre)}

.log{list-style:none;margin:30px 0 0;padding:0;border-left:2px solid var(--fg)}
.log li{position:relative;padding:0 0 18px 24px;display:grid;grid-template-columns:104px 1fr;gap:14px}
.log li::before{content:"";position:absolute;left:-7px;top:.45em;width:12px;height:12px;background:var(--bg);border:2px solid var(--fg);border-radius:50%}
.log li.key::before{background:var(--ochre);border-color:var(--ochre)}
.log time{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.log li>*{min-width:0}

.stratum{background:var(--oil);color:#ece6db;border-color:#000}
.stratum .mono{color:#a39a8c}
.stratum .big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,4.4rem);color:#d9954a;line-height:1;font-variant-numeric:tabular-nums;margin:10px 0 18px}
.stratum h3{font-size:1.6rem;color:#ece6db;margin-bottom:12px}
.stratum p{color:#d8d0c3;margin:0 0 1em}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:30px}
.field{background:var(--card);padding:18px 16px}
.field .y{font-family:var(--mono);color:var(--ochre);font-size:.82rem}
.field h4{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:6px 0 6px}
.field p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.5}

blockquote{margin:30px 0;padding:0 0 0 20px;border-left:3px solid var(--ochre);font-style:italic;font-size:1.2rem}
.awards{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.awards span{font-family:var(--mono);font-size:.76rem;border:1px solid var(--line);padding:6px 10px;border-radius:2px;background:var(--card)}
/* Фотографии: отпечатки с полями, подпись моноширинным */
.photo{margin:0;background:var(--card);border:1px solid var(--line);padding:8px 8px 0;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px -14px rgba(0,0,0,.35)}
.photo img{display:block;width:100%;height:auto;background:var(--line);filter:saturate(.92) contrast(1.02)}
.photo figcaption{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);padding:9px 2px 10px;display:flex;justify-content:space-between;gap:12px}
.photo figcaption b{font-weight:500;color:var(--ochre)}
.diptych{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 30px}
.diptych .photo img{aspect-ratio:4/5;object-fit:cover;object-position:50% 22%}
.wide{margin:30px 0}
@media (max-width:480px){.diptych{gap:8px}.photo figcaption{flex-direction:column;gap:2px}}
.note{background:color-mix(in oklab,var(--salt) 80%,transparent);padding:16px 18px;border-radius:2px;font-size:.93rem;margin-top:24px}
.note b{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}

.tech{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px}
.tech>div{background:var(--card);padding:18px 16px}
.tech h4{font-family:var(--display);font-size:1rem;margin:0 0 4px}
.tech .y{font-family:var(--mono);font-size:.78rem;color:var(--ochre)}
.tech ul{margin:10px 0 0;padding-left:1.1em;font-size:.92rem;line-height:1.5}
.tech li{margin-bottom:6px}

footer.panel ol{padding-left:1.2em;font-size:.9rem;color:var(--muted)}
footer.panel li{margin-bottom:6px;overflow-wrap:anywhere}
.sign{margin-top:28px;font-family:var(--display);font-weight:600}
.credit{font-size:.82rem;color:var(--muted);margin-top:12px}

.theme{position:fixed;top:14px;right:14px;z-index:3;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 10px;cursor:pointer;border-radius:2px}

@media (max-width:999px){
  :root{--col:auto}
  /* телефон: плотные карточки без размытия (дёшево при прокрутке), лёгкая тень сцены */
  .panel{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 18px 40px -24px rgba(0,0,0,.45)}
  .stratum{background:var(--oil)}
  #scene .iso-halo{filter:blur(6px)}
  .fields{grid-template-columns:1fr 1fr}
  .field{padding:14px 12px}
  .field h4{font-size:1rem}
  .field p{font-size:.84rem}
  .awards span{font-size:.7rem}
  blockquote{font-size:1.08rem;margin:24px 0}
  .panel h2{font-size:1.65rem}
  .yr{font-size:1.8rem}
  .stratum .big{font-size:2.6rem}
  .theme{top:max(10px,env(safe-area-inset-top));right:10px;padding:6px 9px;transition:opacity .3s}
  body:not(.at-top) .theme{opacity:0;pointer-events:none}
  /* подпись к сцене — узкая строка прямо под рисунком, только на первом экране */
  .hud{top:calc(50svh - 6px);bottom:auto;left:16px;right:16px;padding:0;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:.66rem;gap:2px}
  .hud>span:first-child{color:var(--muted)}
  .hud [data-scene-readout]{display:none}
  .lineage{font-size:.72rem;gap:8px}
  .lineage .n{padding:6px 8px}
  .hero{padding-top:calc(50svh + 40px)}
  .hero .panel{padding:22px 18px}
  .hero h1{font-size:1.9rem}
  .hero .mono{margin-bottom:12px;font-size:.7rem}
  .hero p.lead{font-size:1rem;margin-top:12px}
  .scroll-cue{margin-top:16px}
  .col{margin:0 16px}
  .hero{min-height:96svh;justify-content:flex-end;padding-bottom:24px}
  .hero .panel{padding:26px 20px}
  .panel{padding:28px 20px}
  .hud{left:16px;right:16px;width:auto;bottom:12px;grid-template-columns:1fr;opacity:0;transition:opacity .4s}
  body.at-top .hud{opacity:1}
  .hud .r,.hud [data-scene-readout]{text-align:left}
  .hud .hint{display:none}
  .tech{grid-template-columns:1fr}
  .log li{grid-template-columns:1fr;gap:2px}
}
@media (max-width:999px){
  .hero{min-height:100svh}
  .hero .panel{margin-bottom:24px}
  .panel{margin-bottom:58svh}
  footer.panel{margin-bottom:28px}
}
</style>
<style>

html,body{width:1200px;height:630px;overflow:hidden}
body{background:
  radial-gradient(620px 420px at 84% 60%, rgba(217,149,74,.18), transparent 70%),

  #14120f}
#scene{position:absolute;inset:0}

.print img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;filter:contrast(1.04)}
.print span{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#6b645a;padding:9px 2px 11px}

.t h1 span{display:block;color:#d9954a}
.t .rule{width:60px;height:3px;background:#d9954a;margin:24px 0 20px}

.url{position:absolute;left:58px;right:40px;bottom:30px;z-index:2;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d7468}
.url em{font-style:normal;color:#d9954a;text-transform:none;letter-spacing:.04em;font-size:13px}
</style>

<script>
"use strict";
const k = (() => {

const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}

      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {

      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));

    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));

    let sweep = wrap(to - from);

    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);

    tones.push(toneRow);

  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;

      const b = run.map((j) => rings[i + 1][j]).reverse();

      all.push(d);

    const dr = meridian[i + 1][1] - meridian[i][1];

    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;

    const hi = Math.min(...ranges.map(([, x]) => x));

    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  let bevelPath = "";

    const ends = [];

    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);

      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;

    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {

    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];

      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {
  return Array.from({ length: steps + 1 }, (_, index) => pointOf(F, s, r, a0 + ((a1 - a0) * index) / steps));
}

    const b0 = [cx + 74, cy - 22, 9], b1 = [cx + 98, cy - 22, 9];
    pushBox(cx + 72, cy - 30, 0, 28, 16, 3, "m-brick");
    push(mid(b0, b1), rod(b0, b1, 7.2, "m-iron", 28, { inner: "" }));
    for (const xx of [cx + 79, cx + 87, cx + 95]) push([xx, cy - 22, 9], L(G.arcOf(G.frameAlong(b0, [1, 0, 0]), xx - b0[0], 7.25, P), { tone: "lo" }));
    push([cx + 96, cy - 22, 30], S(k.cylinder(cx + 96, cy - 22, 1.8, 15, 34, P, 16), "m-iron"));
    push([cx + 96, cy - 22, 49], S(k.cylinder(cx + 96, cy - 22, 2.6, 48, 2, P, 16), "m-iron"));

    // Юрта, контора, деревянный резервуар
    const yx = -168, yy = 30;
    push([yx, yy, 4], S(k.cylinder(yx, yy, 13, 0, 8, P, 40), "m-felt"));
    const FR = G.frameOf([yx, yy, 8], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
    push([yx, yy, 10], S(G.solidOf([[0, 13.6], [5.6, 4.2], [6.2, 2.6]], FR, P, { steps: 40 }), "m-felt"));
    push([yx, yy, 14.3], L(k.ring(yx, yy, 2.6, 14.2, P, 20), { tone: "mid" }));
    push([yx + 10, yy + 7.6, 3], S(G.prismOf(G.frameOf([yx + 12.6, yy + 7.4, 0], [Math.cos(0.6), Math.sin(0.6), 0], [-Math.sin(0.6), Math.cos(0.6), 0], [0, 0, 1]), [[-2.4, 0], [2.4, 0], [2.4, 6], [-2.4, 6]], 0, 0.8, P), "m-door"));
    for (const z of [3, 6]) push([yx, yy + 13, z], L(k.sideArc(yx, yy, 13.05, z, P, 32), { tone: "faint" }));

    pushBox(-146, 12, 0, 20, 14, 10, "m-wood", { bevel: 0.5 });
    const roofF = G.frameOf([-147, 12, 10], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    push([-136, 19, 13], S(G.prismOf(roofF, [[-1, 0], [15, 0], [7, 6]], 0, 22, P), "m-roof"));
    push([-136, 26.2, 5], L(k.segment([-140, 26.1, 3.5], [-140, 26.1, 7.5], P) + k.segment([-132, 26.1, 3.5], [-132, 26.1, 7.5], P), { tone: "mid" }));

    push([-58, 18, 5], S(k.cylinder(-58, 18, 10, 0, 10, P, 36), "m-wood"));
    for (const z of [3, 7]) push([-58, 28, z], L(k.sideArc(-58, 18, 10.05, z, P, 30), { tone: "lo" }));
    push([-58, 18, 10], L(k.ring(-58, 18, 8.5, 10, P, 30), { tone: "faint" }));

    // Фонтан 29.04.1911 и нефть на настиле
    drops(state, t, cx, cy);
  }

  // Частицы фонтана — нефть, летящая выше кронблока
  const PHONE = matchMedia("(max-width: 999px)").matches;
  const DROPS = Array.from({ length: PHONE ? 70 : 150 }, () => ({ a: rnd() * TAU, v: 0.8 + rnd() * 0.3, sp: 1 + rnd() * 14, ph: rnd(), r: 0.7 + rnd() * 1.5 }));
  function drops(state, t, cx, cy) {
    if (state.gush < 0.01) return;
    const g = 120;
    for (const p of DROPS) {
      const life = 2 * 140 * p.v / g;
      const age = ((t / life + p.ph) % 1) * life;
      const vz = 140 * p.v * state.gush;
      const z = 3 + vz * age - 0.5 * g * age * age;
      if (z < 0) continue;
      const pos = [cx + Math.cos(p.a) * p.sp * age, cy + Math.sin(p.a) * p.sp * age, z];
      const s = k.iso(pos, P);
      push(pos, `<circle class="drop" cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="${(p.r * scale() * 1.1).toFixed(2)}" opacity="${(0.55 + 0.45 * state.gush).toFixed(2)}"/>`);
    }
    // сплошная струя от устья до вершины фонтана
    const top = 3 + (140 * 0.95 * state.gush) ** 2 / (2 * 120);
    const a0 = k.iso([cx, cy, 2.4], P), a1 = k.iso([cx, cy, top], P), w0 = P.scale * 1.6, w1 = P.scale * 5;
    push([cx, cy, 60], `<path class="jet" opacity="${state.gush.toFixed(2)}" d="M${(a0[0] - w0).toFixed(1)} ${a0[1].toFixed(1)} L${(a1[0] - w1).toFixed(1)} ${a1[1].toFixed(1)} Q${a1[0].toFixed(1)} ${(a1[1] - w1 * 2).toFixed(1)} ${(a1[0] + w1).toFixed(1)} ${a1[1].toFixed(1)} L${(a0[0] + w0).toFixed(1)} ${a0[1].toFixed(1)} Z"/>`);
    const pool = k.onTop(k.circleRing(cx + 4, cy - 6, 6 + 18 * state.gush, 28), 0.15, P, true);
    push([cx, cy - 40, 0], `<path class="pool" d="${pool}" opacity="${(0.7 * state.gush).toFixed(2)}"/>`);
  }
  const scale = () => Math.max(0.5, P.scale * 0.9);

  // ---------- Стальная вышка Жанажола (1978) ----------
  function zhanazhol(state, t) {
    const [cx, cy] = D2;
    // подвышечное основание и пол буровой
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) pushBox(cx + sx * 15 - 3, cy + sy * 15 - 3, 0, 6, 6, 12, "m-steel");
    pushBeam([cx - 15, cy - 15, 6], [cx + 15, cy + 15, 6], 0.6, "m-steel");
    pushBeam([cx + 15, cy - 15, 6], [cx - 15, cy + 15, 6], 0.6, "m-steel");
    pushBox(cx - 21, cy - 21, 12, 42, 42, 2.4, "m-steel", { bevel: 0.6 });
    tower(cx, cy, 15, 3.8, 14.4, 138, 8, "m-paint", 1.1, true);
    pushBox(cx - 5, cy - 5, 152, 10, 10, 4, "m-paint", { bevel: 0.5 }); // кронблок
    push([cx, cy, 158], S(k.cylinder(cx, cy, 1.2, 156, 5, P, 10), "m-steel")); // мачта-огонь
    // ротор: вращающийся стол с рисками
    push([cx, cy, 15], S(k.cylinder(cx, cy, 5.4, 14.4, 2.2, P, 32), "m-iron"));
    push([cx, cy, 16.7], L(k.radialTicks(cx, cy, 4.6, 16, 4, 16.6, [0.8, 1.6], P, state.rotor).major + k.radialTicks(cx, cy, 4.6, 16, 4, 16.6, [0.8, 1.6], P, state.rotor).minor, { tone: "hi" }));
    // талевый блок, крюк, вертлюг, квадрат (ведущая труба)
    const bz = state.block;
    pushBeam([cx, cy, 16.6], [cx, cy, bz - 6], 0.9, "m-iron");
    push([cx, cy, bz - 3], S(k.cylinder(cx, cy, 2, bz - 6, 4, P, 14), "m-steel"));
    pushBox(cx - 3.2, cy - 2, bz, 6.4, 4, 9, "m-yellow", { bevel: 0.5 });
    push([cx, cy, (bz + 152) / 2], [-2.2, -0.8, 0.8, 2.2].map((o) => L(k.segment([cx + o, cy, bz + 9], [cx + o * 0.8, cy, 152], P), { tone: "mid", className: "cable thin" })).join(""));
    // лебёдка (буровая лебёдка с барабаном) и дизели
    pushBox(cx - 40, cy - 8, 12, 16, 16, 9, "m-steel", { bevel: 0.6 });
    const dF = G.frameOf([cx - 32, cy - 9, 18], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
    push([cx - 32, cy + 9, 18], S(G.disc(0, 18, 3.6, dF, P, { steps: 24 }), "m-iron"));
    for (const dy of [-16, -6, 4]) {
      pushBox(cx - 62, cy + dy, 0, 16, 8, 7, "m-green", { bevel: 0.5 });
      push([cx - 50, cy + dy + 4, 10], S(k.cylinder(cx - 50, cy + dy + 4, 0.9, 7, 6, P, 10), "m-iron"));
    }
    // приёмные мостки и стеллаж с трубами
    pushBox(cx + 21, cy - 3, 6, 40, 6, 1.6, "m-steel");
    for (const [sx, sz] of [[0, 0], [0, 1], [1, 0]]) {
      for (let i = 0; i < 4; i++) {
        const y = cy + 9 + i * 3.4 + sx * 1.7, z = 3.4 + sz * 3;
        const a = [cx + 24, y, z], b = [cx + 68, y, z];
        push(mid(a, b), rod(a, b, 1.5, "m-pipe", 12));
      }
    }
    for (const x of [cx + 28, cx + 46, cx + 64]) pushBox(x - 1, cy + 7, 0, 2, 16, 2, "m-wood");
    // буровые насосы и ёмкости раствора
    for (const y of [-30, -14]) {
      pushBox(cx + 30, cy + y, 0, 22, 10, 8, "m-red", { bevel: 0.5 });
      const f = G.frameOf([cx + 52, cy + y + 5, 4], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
      push([cx + 54, cy + y + 5, 4], S(G.disc(0, 4, 2.6, f, P, { steps: 18 }), "m-iron"));
    }
    for (let i = 0; i < 3; i++) pushBox(cx + 4 + i * 22, cy - 82, 0, 20, 14, 9, "m-steel", { bevel: 0.6 });
    // будка бурильщика и вагончики
    pushBox(cx - 12, cy - 44, 0, 22, 12, 11, "m-cabin", { bevel: 0.6 });
    for (const y of [-74, -56]) {
      pushBox(cx - 80, cy + y, 0, 30, 12, 10, "m-cabin", { bevel: 0.6 });
      for (const wx of [-74, -64, -56]) push([cx + wx, cy + y + 12, 6], L(k.segment([cx + wx, cy + y + 12.05, 4.5], [cx + wx + 4, cy + y + 12.05, 4.5], P) + k.segment([cx + wx, cy + y + 12.05, 7.5], [cx + wx + 4, cy + y + 12.05, 7.5], P), { tone: "mid" }));
    }
    // газопровод на опорах — газ уходит в Актобе
    const gy = -40;
    for (let x = 150; x <= 196; x += 12) pushBox(x - 1, gy - 1, 0, 2, 2, 5, "m-steel");
    push([175, gy, 5], rod([140, gy, 6], [199, gy, 6], 1.6, "m-yellow", 14));
    // факел
    pushBox(186, 40, 0, 3, 3, 26, "m-steel");
    flame(t, [187.5, 41.5, 27]);
  }

  function flame(t, at) {
    if (still.matches) return;
    const s = k.iso(at, P), r = P.scale * 1.6;
    const f = 1 + 0.18 * Math.sin(t * 11) + 0.1 * Math.sin(t * 17);
    push(at, `<path class="flame" d="M${(s[0] - r * 1.4).toFixed(1)} ${s[1].toFixed(1)} Q${(s[0] - r).toFixed(1)} ${(s[1] - r * 3 * f).toFixed(1)} ${s[0].toFixed(1)} ${(s[1] - r * 5.2 * f).toFixed(1)} Q${(s[0] + r).toFixed(1)} ${(s[1] - r * 3 * f).toFixed(1)} ${(s[0] + r * 1.4).toFixed(1)} ${s[1].toFixed(1)} Z"/>`);
  }

  // Дым паровика
  const PUFFS = Array.from({ length: 9 }, (_, i) => ({ ph: i / 9, dx: rnd() * 8 - 2 }));
  function smoke(t) {
    for (const p of PUFFS) {
      const a = (t / 7 + p.ph) % 1;
      const pos = [D1[0] + 96 - a * 22 + p.dx * a, D1[1] - 22 - a * 14, 51 + a * 46];
      const s = k.iso(pos, P);
      push(pos, `<circle class="puff" cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="${((1.5 + a * 6) * P.scale).toFixed(1)}" opacity="${(0.4 * Math.sin(Math.PI * a)).toFixed(2)}"/>`);
    }
  }

  // Кусты саксаула и полыни
  const BUSHES = Array.from({ length: 26 }, () => {
    let x, y;
    do { x = X0 + 8 + rnd() * (X1 - X0 - 16); y = Y0 + 8 + rnd() * (Y1 - Y0 - 16); }
    while ((Math.abs(x - D1[0]) < 30 && y > 30) || (Math.abs(x - D2[0]) < 75) || (x > -190 && x < -20 && y > -84 && y < -8) || (Math.abs(x + 168) < 18 && Math.abs(y - 30) < 18) || (x > -150 && x < -120 && y > 8 && y < 32) || (Math.abs(x + 58) < 14 && Math.abs(y - 18) < 14) || (x > -40 && x < 15 && y > 30));
    return { x, y, r: 1.4 + rnd() * 1.8 };
  });
  function bushes() {
    for (const b of BUSHES) push([b.x, b.y, 0], ball([b.x, b.y, b.r * 0.7], b.r, "m-bush"));
  }

  // ---------- Состояние и камера ----------
  const state = { az: 54, el: 30, zoom: 1, fx: 0, fy: 0, fz: -40, drill: 0, beam: 0, wheel: 0, rotor: 0, block: 120, gush: 0, tool: 0, found: false };
  const target = { az: 54, el: 30, zoom: 1, fx: 0, fy: 0, fz: -40, drill: 0, gush: 0 };
  let W = 0, H = 0, area = { x: 0, y: 0, w: 0, h: 0 };
  function resize() {
    const r = root.getBoundingClientRect();
    W = r.width; H = r.height;
    svg.setAttribute("viewBox", `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
    const wide = W >= 1000;
    area = wide ? { x: Math.min(700, W * 0.46), y: 40, w: W - Math.min(700, W * 0.46) - 24, h: H - 80 } : { x: 0, y: H * 0.03, w: W, h: H * 0.45 };
    // макет может задать свою область сцены: data-area="x,y,w,h" в пикселях
    if (root.dataset.area) { const [x, y, w, h] = root.dataset.area.split(",").map(Number); area = { x, y, w, h }; }
    dirty = true;
  }

  const EXTREMES = [[X0, Y0, Z.base], [X1, Y0, Z.base], [X0, Y1, Z.base], [X1, Y1, Z.base], [X0, Y0, 0], [X1, Y1, 0], [D2[0], D2[1], 160], [D1[0], D1[1], 120]];
  function camera() {
    const fit = k.fitProjection(EXTREMES, area.w, area.h, { pad: 10, azimuth: state.az, elevation: state.el });
    const p = { origin: [0, 0], scale: fit.scale * state.zoom, azimuth: state.az, elevation: state.el };
    const m = k.iso([state.fx, state.fy, state.fz], p);
    p.origin = [area.x + area.w / 2 - m[0], area.y + area.h / 2 - m[1]];
    return p;
  }

  // Ключевые кадры по разделам страницы (data-scene="az,zoom,fx,fy,fz,gush")
  const keys = [...document.querySelectorAll("[data-scene]")];
  const drillSection = document.querySelector("[data-drill]");
  function fromScroll() {
    const midY = innerHeight * 0.5;
    const pts = keys.map((el) => {
      const r = el.getBoundingClientRect();
      const v = el.dataset.scene.split(",").map(Number);
      return { c: r.top + Math.min(r.height, innerHeight) / 2, v };
    });
    let v = pts[0].v;
    if (midY >= pts[pts.length - 1].c) v = pts[pts.length - 1].v;
    else for (let i = 0; i < pts.length - 1; i++) {
      if (midY >= pts[i].c && midY < pts[i + 1].c) {
        const f = smooth((midY - pts[i].c) / (pts[i + 1].c - pts[i].c));
        v = pts[i].v.map((a, j) => lerp(a, pts[i + 1].v[j], f));
        break;
      }
    }
    [target.az, target.zoom, target.fx, target.fy, target.fz, target.gush] = v;
    if (drillSection) {
      const r = drillSection.getBoundingClientRect();
      const p = clamp((innerHeight * 0.75 - r.top) / (r.height * 0.85), 0, 1);
      target.drill = Math.max(p, r.bottom < 0 ? 1 : 0);
    }
  }

  const depthM = (d) => Math.round(d * 2894 / 10) * 10;
  function say() {
    const z = state.drill > 0.02 && state.fx > -10;
    const text = z
      ? (state.found ? "скв. №4 · приток из подсоли · 2 800–2 894 м" : `скв. №4 · бурение · ${depthM(state.drill).toLocaleString("ru-RU")} м`)
      : (state.gush > 0.05 ? "скв. №3 · фонтан · ≈225 м" : "скв. №3 · ударно-канатное бурение");
    if (readout && readout.textContent !== text) readout.textContent = text;
    const era = z ? "1978 · Жанажол · роторное бурение" : (state.fx < -10 ? "1911 · Доссор · деревянная вышка" : "Доссор 1911 — Жанажол 1978");
    if (eraLabel && eraLabel.textContent !== era) eraLabel.textContent = era;
  }

  function draw(t) {
    P = camera();
    items.length = 0;
    bushes();
    dossor(state, t);
    zhanazhol(state, t);
    seed = 99;
    // караван: четыре верблюда друг за другом
    const u0 = t * 0.012;
    for (let i = 0; i < 4; i++) {
      const r = routeAt(u0 - i * 0.062);
      camel(r.x, r.y, r.h, t * 3.2 + i * 1.3, i === 0);
    }
    smoke(t);
    items.sort((a, b) => a.d - b.d);
    world.innerHTML = ground(state) + items.map((i) => i.s).join("");
    svg.classList.toggle("found", state.found);
  }

  let frame = 0, last = 0, clock = 0, dirty = true, visible = true, lastDraw = -1e9, drawCost = 0;
  const panels = [...document.querySelectorAll(".panel")];
  function covered() {
    if (W >= 1000) return false;
    const top = area.y + area.h * 0.1, bottom = area.y + area.h * 0.9;
    return panels.some((el) => { const r = el.getBoundingClientRect(); return r.top <= top && r.bottom >= bottom; });
  }
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    const calm = still.matches;
    if (!calm) clock += dt;
    const ease = (a, b, tau) => (calm || Math.abs(b - a) < 2e-3 ? b : a + (b - a) * (1 - Math.exp(-dt / tau)));
    state.az = ease(state.az, target.az + (calm || PHONE ? 0 : 1.6 * Math.sin(clock / 6)), 0.6);
    state.el = ease(state.el, 30 + 4 * (state.zoom - 1), 0.6);
    state.zoom = ease(state.zoom, target.zoom, 0.6);
    state.fx = ease(state.fx, target.fx, 0.6);
    state.fy = ease(state.fy, target.fy, 0.6);
    state.fz = ease(state.fz, target.fz, 0.6);
    const prevDrill = state.drill;
    state.drill = ease(state.drill, target.drill, 0.9);
    // фонтан: включается на разделе «Доссор 1911», с атакой и затуханием
    state.gush = ease(state.gush, target.gush, target.gush > state.gush ? 0.5 : 1.4);
    if (state.gush < 0.005) state.gush = 0;
    state.found = state.drill > 0.985;
    if (!calm) {
      state.beam = 0.15 * Math.sin(clock * 2.4);
      state.wheel = clock * 2.4;
      state.tool = 1.2 * Math.sin(clock * 2.4 - 0.4);
      state.rotor += dt * (state.found ? 0.6 : 2.6);
    }
    // талевый блок опускается по мере проходки и поднимается для наращивания свечи
    const stand = (state.drill * 14) % 1;
    state.block = 32 + 104 * (1 - stand) + (calm ? 0 : 0.6 * Math.sin(clock * 1.3));
    if (Math.abs(state.drill - prevDrill) > 1e-4) dirty = true;
    // На телефоне: не рисуем, пока сцену целиком закрывает текстовая карточка,
    // и держим частоту кадров по силам устройства (кадр дороже 20 мс — рисуем реже).
    const due = now - lastDraw >= Math.max(1000 / 40, drawCost * 1.6);
    if ((calm || due) && !covered()) {
      const t0 = performance.now();
      draw(clock);
      drawCost = drawCost * 0.8 + (performance.now() - t0) * 0.2;
      lastDraw = now;
    }
    say();
    frame = visible && !document.hidden && !calm ? requestAnimationFrame(tick) : 0;
    if (calm) frame = 0;
  }
  const run = () => { if (!frame) { last = 0; frame = requestAnimationFrame(tick); } };
  addEventListener("scroll", () => { fromScroll(); if (still.matches) requestAnimationFrame(tick); else run(); }, { passive: true });
  addEventListener("resize", () => { resize(); fromScroll(); run(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); });
  still.addEventListener?.("change", run);
  resize();
  fromScroll();
  Object.assign(state, { az: target.az, zoom: target.zoom, fx: target.fx, fy: target.fy, fz: target.fz, drill: target.drill });
  run();
  window.__scene = { state, target, draw };
})(k, G);

</script>
<script>
window.__scene.target.drill = 1; window.__scene.state.drill = 1; window.__scene.state.gush = 1;
</script>
</body>
</html>

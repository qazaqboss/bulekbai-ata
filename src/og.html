<style>
/* Превью ссылки 1200×630: портрет-отпечаток, заголовок, живая сцена справа */
html,body{width:1200px;height:630px;overflow:hidden}
body{background:

#scene{position:absolute;inset:0}
.hud,.theme{display:none}
.frame{position:absolute;inset:16px;border:1px solid #3a342c;z-index:3;pointer-events:none}
.print{position:absolute;left:58px;top:92px;width:262px;z-index:2;background:#f3efe6;padding:10px 10px 0;transform:rotate(-2.2deg);

.print img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;filter:contrast(1.04)}
.print span{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#6b645a;padding:9px 2px 11px}
.print span b{font-weight:500;color:#b7752b}
.t{position:absolute;left:372px;top:0;bottom:0;width:380px;z-index:2;display:flex;flex-direction:column;justify-content:center}
.t .mono{color:#a39a8c;font-size:12px;letter-spacing:.14em}
.t h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.02em;color:#ece6db;margin:16px 0 0}
.t h1 span{display:block;color:#d9954a}
.t .rule{width:60px;height:3px;background:#d9954a;margin:24px 0 20px}
.t p{font-family:var(--body);font-size:17px;line-height:1.5;color:#d8d0c3;margin:0}
.url{position:absolute;left:58px;right:40px;bottom:30px;z-index:2;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d7468}
.url em{font-style:normal;color:#d9954a;text-transform:none;letter-spacing:.04em;font-size:13px}

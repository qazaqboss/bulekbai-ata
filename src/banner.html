<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Булекбаевы — баннер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--PAGE_STYLE-->
<style>
/* Баннер 1280×640: слева заголовок, справа живая сцена в момент «открытия» */
html,body{width:1280px;height:640px;overflow:hidden}
body{background:
  radial-gradient(900px 520px at 78% 58%, rgba(217,149,74,.16), transparent 70%),
  radial-gradient(700px 400px at 10% 100%, rgba(217,149,74,.08), transparent 70%),
  #14120f}
#scene{position:absolute;inset:0}
.hud,.theme{display:none}
.b{position:absolute;left:64px;top:0;bottom:0;width:560px;z-index:1;display:flex;flex-direction:column;justify-content:center}
.b .mono{color:#a39a8c;font-size:13px;letter-spacing:.14em}
.b h1{font-family:var(--display);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:#ece6db;margin:18px 0 0}
.b h1 span{display:block;color:#d9954a}
.b .rule{width:72px;height:3px;background:#d9954a;margin:30px 0 24px}
.pair{display:flex;gap:28px;font-family:var(--mono)}
.pair div{display:flex;flex-direction:column;gap:4px}
.pair b{font-family:var(--display);font-weight:600;font-size:21px;color:#ece6db}
.pair i{font-style:normal;font-size:13px;color:#a39a8c;letter-spacing:.06em}
.pair .arr{align-self:center;color:#d9954a;font-size:22px}
.foot{position:absolute;left:64px;right:40px;bottom:30px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d7468}
.foot em{font-style:normal;color:#d9954a}
.frame{position:absolute;inset:18px;border:1px solid #3a342c;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"><svg><g class="world"></g></svg></div>
<div data-scene="50,0.9,0,0,-62,1" style="position:absolute;top:0;left:0;width:1px;height:640px"></div>
<div class="frame"></div>
<div class="b">
  <div class="mono">Семейная история · Эмба — Актобе · 1893–2017</div>
  <h1>Булекбаевы <span>Два поколения нефти</span></h1>
  <div class="rule"></div>
  <div class="pair">
    <div><b>Елеу</b><i>1893–1953 · Доссор</i></div>
    <span class="arr">→</span>
    <div><b>Зейнулла</b><i>1932–2017 · Жанажол</i></div>
  </div>
</div>
<div class="foot"><span>Доссор 1911 · фонтан скв. №3</span><span><em>Жанажол 1978 · подсолевая нефть, 2 894 м</em></span></div>
<!--SCENE_SCRIPT-->
<script>
// кадр «открытия»: колонна дошла до подсоли, на Доссоре бьёт фонтан
window.__scene.target.drill = 1; window.__scene.state.drill = 1;
window.__scene.state.gush = 1;
</script>
</body>
</html>
